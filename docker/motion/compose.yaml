services:
  motion:
    image: "${MOTION_IMAGE:?MOTION_IMAGE must identify the motion image}"
    network_mode: host
    ipc: host
    cpuset: "${MOTION_CPUSET:-21,22}"
    user: "1000:1000"
    environment:
      ROS_DOMAIN_ID: "7"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      FASTRTPS_DEFAULT_PROFILES_FILE: "/etc/robot/fastdds.xml"
      FASTDDS_DEFAULT_PROFILES_FILE: "/etc/robot/fastdds.xml"
      MOTION_USE_MOCK_RT_CONTROL: "${MOTION_USE_MOCK_RT_CONTROL:-false}"
      MOTION_DRY_RUN: "${MOTION_DRY_RUN:-false}"
      MOTION_TRAJECTORY_ACTION: "${MOTION_TRAJECTORY_ACTION:-/whole_body_jtc/follow_joint_trajectory}"
    volumes:
      - motion-data:/var/lib/robot/motion
      - motion-logs:/var/log/robot/motion
    cap_drop: ["ALL"]
    init: true
    restart: unless-stopped
    stop_grace_period: "30s"
    healthcheck:
      test: ["CMD", "/usr/local/bin/motion-healthcheck"]
      interval: "10s"
      timeout: "6s"
      start_period: "90s"
      retries: 3

volumes:
  motion-data:
  motion-logs:
