pointcloud_to_laserscan_node:
  ros__parameters:
    target_frame: 2d_body          # 投影到2d_body平面
    transform_tolerance: 0.05
    min_height: -0.9                # 过滤地面，根据雷达安装高度调整
    max_height: 1.0                # 过滤头顶以上
    angle_min: -1.0472,   # -60度，单位弧度
    angle_max:  1.0472,   #  60度，前方120度FOV
    angle_increment: 0.00872       # 0.5度
    scan_time: 0.1
    range_min: 0.1
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0