parallel_updown_aware_ik:
  groups:
    fixed_h_group: dual_v5_arm
    free_h_group: dual_v5_arm_with_base
    left_tip: left_v5_tool0
    right_tip: right_v5_tool0
    base_frame: base_link
    solver_plugin: bio_ik/BioIKKinematicsPlugin

  h_planner:
    left_reach_sphere:
      center: [-0.065, 0.2, 1.025]
      radius: 0.815
    right_reach_sphere:
      center: [-0.065, -0.2, 1.025]
      radius: 0.815
    physical_limits: [0.0, 0.99]
    tool0_offset: 0.1
    sphere_margin: 0.0

  candidate_generator:
    h_mode: fixed_discrete        # fixed_discrete | continuous_range
    h_search_margin: 0.10         # search window around minimum-motion h, not physical limit
    h_step: 0.10
    h_candidate_count: 5
    max_updown_delta: inf
    seed_count: 4
    seed_noise: 0.35
    try_target_orders: true

  parallel_executor:
    workers: 4
    timeout_per_trial: 0.5

  validator:
    check_tip_error: true
    position_tolerance: 0.02
    orientation_tolerance: 0.05
    check_collision: false
    reject_swapped_tips: true

  fallback_manager:
    enabled: true
    release_updown_timeout: 2.0
    release_updown_seed_count: 12

  cost_scorer:
    weights:
      updown_delta: 1.0
      joint_delta: 0.01
      solve_ms: 0.001
      h_center_delta: 0.0
