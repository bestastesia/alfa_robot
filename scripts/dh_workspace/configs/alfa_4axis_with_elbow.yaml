name: ALFA 4-Axis Arm With Elbow
convention: standard
notes: |
  4-axis DH proposal that keeps upper arm and forearm links.
  L1: base yaw
  L2: shoulder pitch / upper arm
  L3: elbow pitch / forearm
  L4: wrist orientation adjustment
links:
  - name: waist_yaw
    type: revolute
    theta: 0.0
    d: 0.1273
    a: 0.0
    alpha: 1.5707963267948966
    qlim: [-3.141592653589793, 3.141592653589793]
  - name: shoulder_pitch
    type: revolute
    theta: 0.0
    d: 0.0
    a: -0.612
    alpha: 0.0
    qlim: [-1.5707963267948966, 1.5707963267948966]
  - name: elbow_pitch
    type: revolute
    theta: 0.0
    d: 0.0
    a: -0.5723
    alpha: 0.0
    qlim: [-1.5707963267948966, 1.5707963267948966]
  - name: wrist_adjust
    type: revolute
    theta: 0.0
    d: 0.0
    a: 0.1639
    alpha: 0.0
    qlim: [-3.141592653589793, 3.141592653589793]
sampling:
  samples: 30000
  seed: 42
output:
  csv: alfa_4axis_with_elbow_workspace.csv
