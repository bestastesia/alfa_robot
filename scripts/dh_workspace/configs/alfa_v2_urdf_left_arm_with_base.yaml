    axis: [1.0, 0.0, 0.0]
    qlim: [0.0, 0.15]
  - name: leftjoint5
    type: revolute
    origin:
      xyz: [0.092, 0.0018, 0.0]
      rpy: [-1.5708, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    qlim: [-1.57, 1.57]
  - name: left_ee_joint
    type: fixed
