notes: |
  Exact URDF origin/axis chain for the V2 left arm with base translation.
  This is not a standard DH table; it preserves each URDF joint origin rpy/xyz and axis directly.
  Chain: updown -> leftarmbase -> leftjoint1 -> leftjoint2 -> leftjoint3 -> leftjoint4 -> leftjoint5 -> left_ee_joint.
links:
