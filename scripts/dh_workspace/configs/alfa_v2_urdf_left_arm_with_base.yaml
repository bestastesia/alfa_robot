    type: prismatic
    origin:
      xyz: [-0.23547, 0.0, 0.45934]
      rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    qlim: [0.0, 0.95]
  - name: leftarmbase
    type: prismatic
    origin:
      xyz: [-0.16145, 0.4695, 0.146]
      rpy: [0.0, 0.0, 0.0]
    axis: [0.0, 1.0, 0.0]
    qlim: [-0.16, 0.0]
  - name: leftjoint1
    type: prismatic
    origin:
      xyz: [0.094579, -0.021899, 0.088]
      rpy: [0.0, 0.0, 0.0]
    axis: [1.0, 0.0, 0.0]
    qlim: [0.0, 0.45]
  - name: leftjoint2
    type: revolute
    origin:
      xyz: [0.74035, 0.0209, 0.033]
      rpy: [3.14159, -1.5708, 0.0]
    axis: [0.0, 0.0, 1.0]
    qlim: [-3.14, 3.14]
  - name: leftjoint3
    type: revolute
