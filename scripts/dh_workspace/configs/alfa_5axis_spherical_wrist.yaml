name: ALFA Prismatic + 5-Axis Yaw-Pitch + Spherical Wrist
convention: standard
notes: |
  New decoupled DH proposal:
  - Axis 0: base prismatic translation before yaw; its translation axis is perpendicular to the yaw axis.
  - Axis 1: base yaw, selects horizontal direction.
  - Axis 2: shoulder pitch, points the arm in elevation.
  - Axis 3/4/5: orthogonal spherical wrist (Roll-Pitch-Roll style).
  - L2 has d=0 and a=0 so the arm direction is defined by the yaw/pitch gimbal.
  - L4 has d=0 and a=0 so axes 3, 4, 5 intersect at the wrist center.
parameters:
  d1: 0.2
  Larm: 0.35
  Ltool: 0.08
links:
  - name: base_lift
    role: pre_axis_prismatic_translation_perpendicular_to_yaw
    type: prismatic
    theta: 0.0
    d: 0.0
    a: 0.0
    alpha: 1.5707963267948966
    qlim: [0.0, 0.99]
  - name: base_yaw
    role: position_1_base_yaw
    type: revolute
    theta: 0.0
    d: 0.2
    a: 0.0
    alpha: 1.5707963267948966
    qlim: [-3.141592653589793, 3.141592653589793]
  - name: shoulder_pitch
    role: position_2_shoulder_pitch
    type: revolute
    theta: 0.0
    d: 0.0
    a: 0.0
    alpha: -1.5707963267948966
    qlim: [-1.5707963267948966, 1.5707963267948966]
  - name: upper_arm_roll
    role: attitude_1_wrist_roll
    type: revolute
    theta: 0.0
    d: 0.35
    a: 0.0
    alpha: 1.5707963267948966
    qlim: [-3.141592653589793, 3.141592653589793]
  - name: wrist_pitch
    role: attitude_2_wrist_pitch
    type: revolute
    theta: 0.0
    d: 0.0
    a: 0.0
    alpha: -1.5707963267948966
    qlim: [-1.5707963267948966, 1.5707963267948966]
  - name: flange_roll
    role: attitude_3_flange_roll
    type: revolute
    theta: 0.0
    d: 0.08
    a: 0.0
    alpha: 0.0
    qlim: [-3.141592653589793, 3.141592653589793]
sampling:
  samples: 30000
  seed: 42
output:
  csv: alfa_5axis_spherical_wrist_workspace.csv
