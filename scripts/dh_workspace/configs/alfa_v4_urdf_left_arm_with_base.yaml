name: ALFA V4 URDF Left Arm With Base
convention: urdf_origin_axis
source:
  commit: c1cf31b9eaba173e1e32dad9c80c2df7d16d8657
  file: ros2_ws/src/alfa_robot_description/urdf/alfa_robot.urdf.xacro
notes: |
  Exact URDF origin/axis chain for the current c1cf31b mechanical state.
  This is not a standard DH table; it preserves each URDF joint origin rpy/xyz and axis directly.
  Chain: updown -> leftjoint1 -> leftjoint2 -> leftjoint3 -> leftjoint4 -> leftjoint5 -> leftjoint6 -> left_ee_fixed.
  Continuous joints have no finite URDF limit, so qlim uses [-pi, pi] as the sampling window.
links:
  - name: updown
    type: prismatic
    origin:
      xyz: [-0.1, 0, 0.086]
      rpy: [0, 0, 0]
    axis: [0, 0, 1]
    qlim: [0, 0.99]
  - name: leftjoint1
    type: prismatic
    origin:
      xyz: [-0.2858, 0.27, 0.1845]
      rpy: [0, 0, 0]
    axis: [1, 0, 0]
    qlim: [0, 0.3]
  - name: leftjoint2
    type: continuous
    origin:
      xyz: [0.741, 0, 0.0425]
      rpy: [-1.5708, 1.5662, -1.5708]
    axis: [0, 0, 1]
    qlim: [-3.141592654, 3.141592654]
  - name: leftjoint3
    type: continuous
    origin:
      xyz: [-0.00035108, 0.075999, 0.058]
      rpy: [-1.5754, -1.5708, 0]
    axis: [0, 0, 1]
    qlim: [-3.141592654, 3.141592654]
  - name: leftjoint4
    type: continuous
    origin:
      xyz: [0.311, 0, 0.058]
      rpy: [1.5708, 0, 1.5708]
    axis: [0, 0, 1]
    qlim: [-3.141592654, 3.141592654]
  - name: leftjoint5
    type: continuous
    origin:
      xyz: [0, -0.076, 0.058]
      rpy: [-1.4138, -1.5708, 2.9829]
    axis: [0, 0, 1]
    qlim: [-3.141592654, 3.141592654]
  - name: leftjoint6
    type: prismatic
    origin:
      xyz: [0.102, 0.0898, 0.058]
      rpy: [-1.5708, 0, 0]
    axis: [1, 0, 0]
    qlim: [0, 0.15]
  - name: left_ee_fixed
    type: fixed
    origin:
      xyz: [0, 0, 0]
      rpy: [0, 0, 0]
    qlim: [0, 0]
sampling:
  samples: 30000
  seed: 42
output:
  csv: alfa_v4_urdf_left_arm_with_base_workspace.csv
