# This config file is used by ros2_control for the v5 proxy model.
# Keep one trajectory controller active to avoid shared-joint resource conflicts in demo.launch.py.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dual_v5_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

dual_v5_arm_controller:
  ros__parameters:
    joints:
      - updown
      - left_v5_joint1
      - left_v5_joint2
      - left_v5_joint3
      - left_v5_joint4
      - left_v5_joint5
      - left_v5_joint6
      - right_v5_joint1
      - right_v5_joint2
      - right_v5_joint3
      - right_v5_joint4
      - right_v5_joint5
      - right_v5_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
