# This config file is used by ros2_control
# Only one set of controllers is defined to avoid resource conflicts.
# demo.launch.py will activate ALL controllers listed here simultaneously,
# so they must not share any command interfaces.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    dual_arms_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

dual_arms_controller:
  ros__parameters:
    joints:
      - updown
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - leftjoint5
      - leftjoint6
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
      - rightjoint5
      - rightjoint6
    command_interfaces:
      - position
    state_interfaces:
      - position
