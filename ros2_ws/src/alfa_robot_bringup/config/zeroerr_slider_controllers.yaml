# 滑块测试配置 - current all-position controller.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    slider_controller:
      type: forward_command_controller/ForwardCommandController

slider_controller:
  ros__parameters:
    joints:
      - pitch
      - turn
      - updown
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    interface_name: position
