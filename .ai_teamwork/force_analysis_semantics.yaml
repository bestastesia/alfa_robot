tool_load_frames:
  left: left_v5_tool0
  right: right_v5_tool0
semantics:
  tau_axis_Nm: user-confirmed motor rotational load; revolute joint torque around axis_world; positive by right-hand rule
  force_axis_N: joint reaction force projected along axis_world
  force_normal_N: connector/component reaction force projected onto normal_world, the primary connector offset direction
  force_side_N: joint reaction force projected onto side_world = axis_world x normal_world
  force_radial_magnitude_N: connector/component radial resultant sqrt(force_normal_N^2 + force_side_N^2), useful for structural risk ranking
