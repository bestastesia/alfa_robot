# ALFA Robot PLC/Modbus map example.
#
# This file intentionally uses null addresses until the InoProShop final
# Modbus mapping is provided by the PLC owner. Mock/dry-run mode may use nulls;
# real PLC mode rejects unresolved addresses.
connection:
  host: 192.168.1.88
  port: 502
  slave_id: 1
  timeout_s: 1.0

encoding:
  # Replace "unknown" after validating with known LREAL/UDINT values such as 60.0 and 200.0.
  # Accepted values: big, little, unknown.
  lreal_word_order: unknown
  udint_word_order: unknown

axes:
  axis1:
    joint_name: left_v5_joint1
    coils:
      enable_cmd: null
      disable_cmd: null
      reset_fault: null
      stop_execute: null
      emergency_stop: null
      reset_emergency: null
      set_zero: null
      power_status: null
      emergency_latched: null
    registers:
      target_input_deg:
        address: null
        type: lreal
        length: 4
        unit: deg
      return_zero_cmd_id:
        address: null
        type: udint
        length: 2
      velocity_deg:
        address: null
        type: lreal
        length: 4
        unit: deg/s
      acc_deg:
        address: null
        type: lreal
        length: 4
        unit: deg/s^2
      dec_deg:
        address: null
        type: lreal
        length: 4
        unit: deg/s^2
      emergency_dec_deg:
        address: null
        type: lreal
        length: 4
        unit: deg/s^2
      active_cmd_type:
        address: null
        type: uint16
        length: 1
      move_cmd_id:
        address: null
        type: udint
        length: 2
      move_cmd_done_id:
        address: null
        type: udint
        length: 2
      move_cmd_error_id:
        address: null
        type: udint
        length: 2
      return_zero_ack_id:
