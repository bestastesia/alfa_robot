[project]
name = "alfa-robot-plc-driver"
version = "0.2.0"
description = "ROS-agnostic PLC/Modbus communication core for ALFA Robot axes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
alfa-plc = "alfa_robot_plc_driver.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
