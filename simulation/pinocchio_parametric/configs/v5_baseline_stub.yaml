# ALFA v5 parametric arm baseline.
# Calibrated by T-0015 mechanical engineer from the current deployed ROS2 URDF/Xacro:
#   ros2_ws/src/alfa_robot_description/urdf/alfa_robot.urdf.xacro
# Mesh/inertial source before integration: SolidWorks export alfa_robot_arm_v5_1.
# Units: metres, kilograms, kg*m^2, radians.
robot:
  name: alfa_v5_parametric
  root_link: world

mount:
  parent_link: world
  # In deployed robot these frames are mounted under `updown`; the Pinocchio
  # standalone model uses world as the root while preserving the same relative
  # arm mount offsets. Current distance to centre axis is 0.20 m.
  left_xyz: [0.0, 0.20, 0.18]
  right_xyz: [0.0, -0.20, 0.18]
  rpy: [0.0, 0.0, 0.0]

arms:
  left:
    prefix: left_v5
    mirror_y: 1.0
    color: [0.2, 0.55, 1.0, 1.0]
  right:
    prefix: right_v5
    mirror_y: -1.0
    color: [1.0, 0.55, 0.2, 1.0]

# Current deployed joint topology. Right arm is generated by Y-mirroring the
# fields named *_mirror; axes are kept in each joint child frame, matching the
# current ROS2 URDF convention.
kinematics:
  joint1:
    xyz: [0.0, 0.0, 0.0]
    rpy_mirror: [0.0, 0.0, 0.0]
    axis: [0.0, 0.0, 1.0]
    limit: [-3.14159265, 3.14159265]
    effort: 120.0
    velocity: 1.2
  joint2:
    xyz: [-0.0595, 0.0, 0.0735]
    rpy_mirror: [1.5708, 0.0, 1.5708]
    axis: [0.0, 0.0, -1.0]
    limit: [-3.14159265, 3.14159265]
    effort: 120.0
    velocity: 1.2
  joint3:
    xyz_mirror: [0.0, 0.6, -0.148]
    rpy_mirror: [0.0, 0.0, 3.1416]
    axis: [0.0, 0.0, 1.0]
    limit: [-3.14159265, 3.14159265]
    effort: 100.0
    velocity: 1.2
  joint4:
    xyz_mirror: [0.0, -0.412, 0.009]
    rpy_mirror: [1.5708, -1.5708, 0.0]
    axis: [-1.0, 0.0, 0.0]
    limit: [-3.14159265, 3.14159265]
    effort: 60.0
    velocity: 1.5
  joint5:
    xyz_mirror: [0.0595, -0.074, 0.0]
    rpy_mirror: [-1.5708, 0.0, 1.5708]
    axis: [1.0, 0.0, 0.0]
    limit: [-3.14159265, 3.14159265]
    effort: 60.0
    velocity: 1.5
  joint6:
    xyz_mirror: [-0.06, -0.074, 0.0]
    rpy_mirror: [1.5708, 0.0, 0.0]
    axis: [0.0, 0.0, -1.0]
    limit: [-3.14159265, 3.14159265]
    effort: 40.0
    velocity: 1.5
  tool0_fixed:
    xyz: [0.0, 0.0, 0.08]
    rpy: [0.0, 0.0, 0.0]

# Baseline lengths/offsets derived from the deployed joint origins.
# upper_arm_y = joint3.y = 0.600 m; forearm_y = |joint4.y| = 0.412 m.
# Wrist/flange offsets are represented directly in joint5/joint6 xyz.
mechanical_parameters:
  source: current_ros2_urdf_xacro_plus_solidworks_v5_1
  mount_center_distance_y: 0.20
  mount_height_z: 0.18
  upper_arm_y: 0.600
  forearm_y: 0.412
  shoulder_offset_x: -0.0595
  shoulder_offset_z: 0.0735
  elbow_offset_z: -0.148
  wrist4_offset_z: 0.009
  wrist5_offset_x: 0.0595
  wrist5_offset_y: -0.074
  wrist6_offset_x: -0.060
  wrist6_offset_y: -0.074
  tool0_offset_z: 0.08

# Inertials are copied from the current deployed URDF/Xacro. Off-diagonal terms
# exist in the source URDF; the first Pinocchio template currently accepts only
# inertia_diag, so full_inertia below preserves the exact source tensor for the
# next template upgrade.
