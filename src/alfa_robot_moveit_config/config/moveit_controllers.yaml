# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - torso_group_controller
    - left_arm_controller
    - right_arm_controller
    - dual_arms_controller
    - updown_controller

  torso_group_controller:
    type: FollowJointTrajectory
    joints:
      - updown
    action_ns: follow_joint_trajectory
    default: true
  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - leftarmbase
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - updown
    action_ns: follow_joint_trajectory
    default: true
  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - rightarmbase
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
      - updown
    action_ns: follow_joint_trajectory
    default: true
  dual_arms_controller:
    type: FollowJointTrajectory
    joints:
      - updown
      - leftarmbase
      - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      - rightarmbase
      - rightjoint1
      - rightjoint2
      - rightjoint3
      - rightjoint4
  updown_controller:
    type: FollowJointTrajectory
    joints:
      - updown