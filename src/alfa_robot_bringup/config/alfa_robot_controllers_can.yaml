# 实机 CAN 控制专用 - 仅 joint_state_broadcaster 和 forward_position_controller
# leftjoint2,3,4 使用 0x92 读角度、0xA4 多圈位置闭环控制
# 启动: use_mock_hardware:=false controllers_file:=alfa_robot_controllers_can.yaml

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

forward_position_controller:
  ros__parameters:
    joints:
      - leftjoint2
      - leftjoint3
      - leftjoint4
    interface_name: position
