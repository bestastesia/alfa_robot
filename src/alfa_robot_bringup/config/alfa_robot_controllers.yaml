#
# Joint names from alfa_robot_macro.ros2_control.xacro:
# Position: turn, updown, leftarmbase, leftjoint1, leftjoint2, leftjoint3, leftjoint4
#           rightarmbase, rightjoint1, rightjoint2, rightjoint3, rightjoint4
# Velocity: left back, left forward, right back, right forward
#
# 整机操作时取消注释下方被注释的关节即可
#

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# 位置控制器 - 本次只用左臂 leftjoint2,3,4
forward_position_controller:
  ros__parameters:
    joints:
      # - turn
      # - updown
      # - leftarmbase
      # - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      # - rightarmbase
      # - rightjoint1
      # - rightjoint2
      # - rightjoint3
      # - rightjoint4
    interface_name: position

# 速度控制器 - 底盘轮子 (left back, left forward, right back, right forward)
forward_velocity_controller:
  ros__parameters:
    joints:
      - left back
      - left forward
      - right back
      - right forward
    interface_name: velocity

# 轨迹控制器 - 本次只用左臂 leftjoint2,3,4
joint_trajectory_controller:
  ros__parameters:
    joints:
      # - turn
      # - updown
      # - leftarmbase
      # - leftjoint1
      - leftjoint2
      - leftjoint3
      - leftjoint4
      # - rightarmbase
      # - rightjoint1
      # - rightjoint2
      # - rightjoint3
      # - rightjoint4

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
